<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Page information: the title appears in the browser tab. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Nihal Chahal">
    <meta name="description" content="A CSS demo showing how to use an image as a full-page background.">
    <title>Full Page Background Image Demo | Nihal Chahal</title>

    <style>
      /* Apply the background to the root element of the page. */
      html {
        /* Keep nebula.jpg in the same folder as this HTML file. */
        background-image: url(nebula.jpg);

        /* Fill the background area while preserving the image's proportions.
           Parts of the image may be cropped to fit the screen. */
        background-size: cover;

        /* Keep the background fixed relative to the viewport when scrolling. */
        background-attachment: fixed;

        /* Center the image horizontally and vertically. */
        background-position: center;

        /* Show the image once instead of repeating it as tiles. */
        background-repeat: no-repeat;
      }
    </style>
  </head>

  <body>
    <!-- The body is intentionally empty so only the background is visible.
         Resize the browser or preview to see how cover crops the image. -->
  </body>
</html>
